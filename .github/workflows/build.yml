name: Build Tolibjon Production VST3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up CMake & Ninja
      uses: lukka/get-cmake@latest

    - name: Download and Cache JUCE
      run: |
        git clone --depth 1 --branch master https://github.com/juce-framework/JUCE.git JUCE

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64

    - name: Build VST3 Plugin
      run: cmake --build build --config Release --target TolibjonProduction_VST3

    - name: Upload VST3 Plugin Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tolibjon-Production-VST3
        path: build/TolibjonProduction_artefacts/Release/VST3/
